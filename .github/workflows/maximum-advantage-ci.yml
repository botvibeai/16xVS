name: Maximum Advantage Build Verification

on:
  workflow_dispatch:
  push:
    branches:
      - build/maximum-advantage-vault-2026-07-17
  pull_request:
    branches:
      - recovery/v30-full-2026-07-17

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact build source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete tracked suite
        run: npm test

      - name: Run secure Vault round trip
        run: npm run vault:secure:test

      - name: Record source identity
        run: |
          mkdir -p recovery-ci
          {
            echo "branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee recovery-ci/build-verification.txt

      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 16xvs-maximum-advantage-${{ github.sha }}
          path: recovery-ci/build-verification.txt
          if-no-files-found: warn
          retention-days: 90
